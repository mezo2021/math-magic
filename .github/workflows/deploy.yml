# ==========================================
# 📂 المسار: .github/workflows/deploy.yml
# ⚙️ الوظيفة: أتمتة بناء ونشر التطبيق (Next.js Static Export) على GitHub Pages.
# 📅 تاريخ الفحص: 2024-05-24
# 🛠️ التعديلات: لا يوجد تعديل برمجي (نظيف من أي أكواد Rust). تمت إضافة الوسم فقط.
# ==========================================
name: Deploy Static PWA to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Install dependencies
        run: npm install
        
      - name: Build Next.js Static
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /math-magic
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./out"
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4