name: Build and Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. إعداد لغة Rust
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # 2. تثبيت wasm-pack
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      # 3. بناء محرك Rust ووضعه في مجلد public مباشرة
      - name: Build Rust Engine
        run: |
          mkdir -p public
          wasm-pack build --target web --out-dir public

      # 4. إعداد Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 5. تثبيت مكتبات Next.js
      - name: Install dependencies
        run: npm install

      # 6. بناء Next.js (سيجد ملفات WASM جاهزة في public)
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /math-magic

      # 7. الرفع
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./out"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4